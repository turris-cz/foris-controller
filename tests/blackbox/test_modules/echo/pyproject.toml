[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foris-controller-echo-module"
version = "0.0.0"
description = "echo module for Foris Controller"
authors = [
    { name = "CZ.NIC, z.s.p.o. (https://www.nic.cz/)", email = "packaging@turris.cz" },
]
dependencies = [
    "foris-controller",
]

[project.optional-dependencies]
mqtt = [
    "paho-mqtt",
]
tests = [
    "pytest",
    "ubus",
    "paho-mqtt",
    "foris-controller",
    "foris-controller-testtools",
]
ubus = [
    "ubus",
]

[project.entry-points.foris_controller_modules]
echo = "foris_controller_modules.echo"

[tool.hatch.build.targets.sdist]
packages = [
    "foris_controller_modules/",
]
include = [
    "foris_controller_modules/",
]
[tool.hatch.build.targets.wheel]
packages = [
    "foris_controller_modules/",
]
include = [
    "foris_controller_modules/",
]

